<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="-apple-system, 'DM Sans', 'Segoe UI', sans-serif" role="img" aria-label="PharmaFlow invoice digitization pipeline">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aa2ad"/>
    </marker>
  </defs>
  <text x="600" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#141414">The invoice-digitization pipeline</text>

  <g>
    <rect x="40" y="120" width="180" height="120" rx="18" fill="#F4FBF7" stroke="#00A550" stroke-width="2.5"/>
    <text x="130" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">📷 Capture</text>
    <text x="130" y="198" text-anchor="middle" font-size="14" fill="#5c6672">supplier invoice</text>
    <text x="130" y="218" text-anchor="middle" font-size="14" fill="#5c6672">photographed in-app</text>
  </g>

  <line x1="228" y1="180" x2="292" y2="180" stroke="#9aa2ad" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="300" y="120" width="190" height="120" rx="18" fill="#ffffff" stroke="#d8dde3" stroke-width="2"/>
    <text x="395" y="168" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">PaddleOCR</text>
    <text x="395" y="198" text-anchor="middle" font-size="14" fill="#5c6672">raw text + line item</text>
    <text x="395" y="218" text-anchor="middle" font-size="14" fill="#5c6672">extraction</text>
  </g>

  <line x1="498" y1="180" x2="562" y2="180" stroke="#9aa2ad" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="570" y="120" width="190" height="120" rx="18" fill="#ffffff" stroke="#d8dde3" stroke-width="2"/>
    <text x="665" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">GenAI cleanup</text>
    <text x="665" y="192" text-anchor="middle" font-size="14" fill="#5c6672">batch № · expiry dates</text>
    <text x="665" y="212" text-anchor="middle" font-size="14" fill="#5c6672">MRPs normalized</text>
  </g>

  <line x1="768" y1="180" x2="832" y2="180" stroke="#9aa2ad" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="840" y="120" width="190" height="120" rx="18" fill="#ffffff" stroke="#d8dde3" stroke-width="2"/>
    <text x="935" y="162" text-anchor="middle" font-size="20" font-weight="700" fill="#141414">Human review</text>
    <text x="935" y="192" text-anchor="middle" font-size="14" fill="#5c6672">editable line items</text>
    <text x="935" y="212" text-anchor="middle" font-size="14" fill="#5c6672">before commit</text>
  </g>

  <path d="M935 248 L935 300 L640 300" stroke="#9aa2ad" stroke-width="2.5" fill="none"/>
  <line x1="648" y1="300" x2="560 " y2="300" stroke="#9aa2ad" stroke-width="2.5" marker-end="url(#arr)"/>

  <g>
    <rect x="330" y="268" width="220" height="64" rx="18" fill="#00A550"/>
    <text x="440" y="308" text-anchor="middle" font-size="19" font-weight="700" fill="#ffffff">Inventory lots updated</text>
  </g>
</svg>
